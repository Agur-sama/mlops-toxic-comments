name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: ruff check src tests scripts ui
      - name: Test with coverage gate
        run: pytest --junitxml=junit.xml
      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.sha }}
          path: |
            junit.xml
            coverage.xml

  image:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API and UI images
        env:
          APP_VERSION: ${{ github.sha }}
          VCS_REF: ${{ github.sha }}
        run: docker compose build
      - name: Smoke test complete stack
        shell: bash
        env:
          APP_VERSION: ${{ github.sha }}
          VCS_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color; docker compose down --volumes --remove-orphans' EXIT
          docker compose up --detach --wait --wait-timeout 120
          sh scripts/smoke_test.sh http://127.0.0.1:8000
          test "$(curl --fail --silent http://127.0.0.1:8501/_stcore/health)" = "ok"
          curl --fail --silent http://127.0.0.1:8501/ >/dev/null
          docker compose exec -T ui python -c \
            "import os, requests; response = requests.get(os.environ['API_BASE_URL'] + '/health', timeout=5); response.raise_for_status()"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/toxic-comment-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/toxic-comment-api:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
