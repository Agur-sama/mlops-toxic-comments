services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.2.1}
        VCS_REF: ${VCS_REF:-local}
    image: toxic-comment-api:${APP_VERSION:-1.2.1}
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        APP_VERSION: ${APP_VERSION:-1.2.1}
        VCS_REF: ${VCS_REF:-local}
    image: toxic-comment-ui:${APP_VERSION:-1.2.1}
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
