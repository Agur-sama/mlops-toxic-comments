[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "toxic-comment-mlops"
version = "1.0.0"
description = "Reproducible MLOps project for toxic-comment classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Максим Малыш"}]
dependencies = [
  "fastapi==0.115.6",
  "joblib==1.4.2",
  "numpy==2.1.3",
  "prometheus-client==0.21.1",
  "pydantic==2.10.4",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
train = [
  "dvc==3.59.0",
  "kagglehub==0.3.12",
  "mlflow==2.19.0",
  "nltk==3.9.1",
  "pandas==2.2.3",
]
ui = [
  "requests==2.32.3",
  "streamlit==1.41.1",
]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=toxicity.api --cov=toxicity.inference --cov=toxicity.settings --cov=toxicity.preprocessing --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks", "report", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
