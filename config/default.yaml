project:
  name: toxic-comment-mlops
  version: 1.0.0
  seed: 42
  target: toxic
  text_column: comment_text
  id_column: id

train:
  experiment_name: toxic-comment-classification
  tracking_uri: mlruns
  selection_metric: validation_f1
  data_version: jigsaw-standard-v2
  registered_model_name: toxic-comment-tfidf-logreg

inference:
  model_path: artifacts/models/tfidf_logreg_preprocess_standard.joblib
  metadata_path: artifacts/models/model_metadata.json
  model_version: toxicity-tfidf-logreg-v1.0.0
  threshold: 0.664350614731206
  max_text_length: 5000
  host: 0.0.0.0
  port: 8000

data_versions:
  v1:
    id: jigsaw-minimal-v1
    preprocessing: minimal
  v2:
    id: jigsaw-standard-v2
    preprocessing: standard

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  figures_dir: artifacts/figures
  results_dir: artifacts/results
  models_dir: artifacts/models
  predictions_dir: artifacts/predictions
  report_dir: report

split:
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15

classical:
  max_features: 120000
  min_df: 2
  ngram_range: [1, 2]
  sublinear_tf: true
  max_iter: 1000
  logistic_c: 4.0
  svm_c: 1.0

bert:
  model_name: distilbert-base-uncased
  max_length: 256
  epochs: 2
  learning_rate: 0.00002
  train_batch_size: 16
  eval_batch_size: 32
  gradient_accumulation_steps: 1
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_train_samples: null

